name: Android Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-${{ runner.os }}-${{ hashFiles('**/*.hxml') }}
          restore-keys: |
            haxelib-${{ runner.os }}-

      - name: Set up haxelib directory
        run: |
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib

      - name: Install haxelib dependencies
        run: |
          haxelib install lime
          haxelib install openfl
          haxelib install flixel 5.6.1
          haxelib install flixel-tools
          haxelib install flixel-addons
          haxelib install flixel-ui
          haxelib install hxcpp
          haxelib install hxCodec
          haxelib install linc_luajit
          haxelib install hscript
          haxelib install tjson
          haxelib install hxvlc
          haxelib run lime setup
          haxelib run openfl setup

      - name: Add lime to PATH
        run: |
          LIME_VERSION=$(haxelib list | grep '^lime:' | grep -oP '\d+\.\d+\.\d+' | head -1)
          LIME_PATH="$(haxelib config)/lime/$LIME_VERSION/tools"
          echo "Lime tools path: $LIME_PATH"
          echo "$LIME_PATH" >> $GITHUB_PATH

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android NDK
        run: sdkmanager "ndk;21.4.7075529"

      - name: Configure lime for Android
        run: |
          mkdir -p ~/.lime
          cat > ~/.lime/config.xml << EOF
          <config>
            <section name="android">
              <config name="ANDROID_SDK" value="$ANDROID_SDK_ROOT" />
              <config name="ANDROID_NDK_ROOT" value="$ANDROID_NDK_HOME" />
              <config name="JAVA_HOME" value="$JAVA_HOME" />
              <config name="ANDROID_SETUP" value="true" />
            </section>
          </config>
          EOF

      - name: Build Android
        run: haxelib run lime build android -release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: export/android/bin/app/build/outputs/apk/**/*.apk
