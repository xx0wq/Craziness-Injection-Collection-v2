name: Android Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up environment
        run: |
          sudo apt update
          sudo apt install -y haxe openjdk-17-jdk
          mkdir -p $HOME/haxelib
          haxelib setup $HOME/haxelib

      - name: Install haxelib dependencies
        run: |
          haxelib install lime
          haxelib install openfl
          haxelib install linc_luajit
          haxelib run lime setup
          haxelib run openfl setup
          echo "$HOME/haxelib/lime/$(haxelib list lime | grep -o '[0-9.]*')/tools" >> $GITHUB_PATH

      - name: Build Android
        run: lime build android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: android-apk
          path: export/android/bin/app/build/outputs/apk/**/*.apk
